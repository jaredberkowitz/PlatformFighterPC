# Test threads get a bigger stack: `state::tests::checksum_sees_every_field` builds well over a hundred whole `GameState`s in one
# function, and an unoptimised build gives each its own stack slot (2 MB, the default, ran out when the run's state joined
# `GameState` in sim 120).
[env]
RUST_MIN_STACK = "33554432"

# Windows: link the C runtime into the game's library (pf_bridge.dll), so it runs on PCs without Microsoft's Visual C++
# Redistributable (it needed VCRUNTIME140.dll before: a missing one stops the game from loading the simulation at all).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
