[workspace]
resolver = "2"
members = ["sim-core", "sim-content", "sim-script", "netplay", "tools"]
# godot-bridge/ joins the workspace in Week 4 once gdext is set up.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

# Determinism guardrails. Opt in per crate with `[lints] workspace = true`.
# Everything that runs inside the simulation must opt in.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"   # no f32/f64 math in sim code
disallowed_types = "deny"   # HashMap/HashSet banned, see clippy.toml

[profile.release]
debug = 1
