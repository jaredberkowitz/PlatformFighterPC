; The ocean stage's palette (docs/art/STYLE_SHEET.md): its theme colours, read by StageArt.theme (scripts/stage_art.gd).
; Tune colours here, not in the code. Comments in brackets record why a value is what it is.

[theme]

; (A pale warm horizon above a deepening far sea, 2026-10-19: at the sea's own pale blue the two ran together.)
; (Late afternoon, the light pass, the owner's pick 2026-10-21: a peach horizon under a softer blue, a warm glow low behind the stage.)
sky_top=Color(0.2, 0.4, 0.84, 1)
sky_mid=Color(0.52, 0.64, 0.94, 1)
sky_horizon=Color(1.0, 0.82, 0.66, 1)
; (The gradient fitted to what the cameras see, about 0.03 to 0.09 up, fidelity review 13 item 4, the owner's pick B, 2026-10-27:
; at the shader's own bands the top was reached at 0.13 and every frame showed the pale lower half. The top 22% deeper and the
; middle 8%, in the sky only, StageArt.sky.)
sky_bands=[0.012, 0.07]
sky_deepen=[0.22, 0.08]
; (The sky pass, fidelity review 5: horizon light and soft painted streaks, sky.gdshader look 2, the owner's pick B, 2026-10-22.)
sky_look=2
; (Two broader stratus bands, fidelity review 14 item 1, the owner's pick B: three thin ones read as stripes over the deeper top.)
sky_stratus=[2.0, 1.8]
sky_glow=[Color(1.0, 0.8, 0.58, 1), 0.4]
sky_wisps=[Color(1.0, 1.0, 1.0, 1), 0.45]
soil=Color(0.82, 0.66, 0.5, 1)
soil_dark=Color(0.6, 0.48, 0.46, 1)
grass=Color(0.96, 0.8, 0.5, 1)
grass_light=Color(1.0, 0.95, 0.78, 1)
wood=Color(0.8, 0.62, 0.42, 1)
wood_dark=Color(0.58, 0.42, 0.28, 1)
pattern="dock"
cap="dock"
platform="wood"
grass_vary=0.14
grass_patch=0.25
; The sky answering the sun (the judge's round 41): paler and warmer toward the high sun's side, a deeper blue away.
; (Lower with the late-afternoon sun.)
sun_dir=Vector3(-0.5, 0.1, -0.86)
sun_side=0.2
halo=0.5

[mist]

layers=[[-130.0, -10.0, 6.0, 0.08]]

[backdrop]
; (The near sea deeper and cooler toward the frame's foot, the bands' lips calmed there: fidelity review 11, the owner's pick C. See
; water.gdshader `near_depth`.)
sea_near=[1.25, 1.0]
; (The paper sheets kept to the frame's foot, fidelity review 13 item 8, the owner's pick B, 2026-10-27: they faded into the deepening
; and the near sea read as one flat cyan. water.gdshader `near_waves`.)
sea_near_waves=1.2

; The paper finish on the scenery (Lighting.paper_finish): "A" (the owner's pick in the paper play-area rollout, 2026-10-20).
paper_finish="A"
; The hatched print on the front, play area and paper props (StageBake.surfaces, tools/art/make_prints.py "B"; the owner's pick in
; the meadow pilot, rolled out 2026-10-21).
paper_print="hatched"
; The front at the full paper finish, "C" (the owner's pick for every front, 2026-10-21).
front_finish="C"

; The dock's wood (StageArt._dock_block; the owner's pick B of four mocks, stage refinement pass 4, 2026-10-20): a deep honey deck
; under both fighters' values (it measured 0.76 and bleached; the fighters 0.54 and 0.60, so the deck sits under 0.49 or over 0.65),
; a softer worn line, and warm brown posts (they were near-black). docs/art/stages/mocks/beach_wood/.
deck_wood=Color(0.5, 0.32, 0.18, 1)
deck_worn=Color(1.16, 1.1, 1.04, 1)
pile_wood=Color(0.44, 0.29, 0.19, 1)

; The clouds folded like the pines, fewer and larger puffs (StageArt._clouds `cloud_style` 3; the owner's pick D of four mocks,
; 2026-10-20, docs/art/stages/FOLDED_STYLE.md).
; Cut from card since 2026-10-21 (style 4, the owner's pick after the backgrounds audit, docs/art/stages/BACKGROUNDS.md): flat
; cumulus with a deeper card behind, as the papercraft references draw them; the folded puffs read as crystal.
cloud_style=4
; (Clouds clear of the frame, fidelity review 14 item 1, the owner's pick B, 2026-10-27: each cloud crossing the match camera's top
; lowered until whole, far ones under the wide camera's top, the moved ones at 0.8 of their size. StageArt._clear_of_frame.)
cloud_clear="B"
; (The headland painted, fidelity review 15 item 4, the owner's pick B, 2026-10-29: through the air at about 200 it was one pale sage
; card; painted patches, a deeper green, less air and a shade side toward the town. StageBake.HEADLAND_TRY.)
headland="B"

; (Warm reds and oranges with one teal: the blue roofs went grey in the air.)
town_roofs=[Color(0.86, 0.36, 0.3, 1), Color(0.26, 0.6, 0.62, 1), Color(0.9, 0.58, 0.3, 1), Color(0.92, 0.46, 0.34, 1), Color(0.8, 0.42, 0.52, 1)]
town_walls=[Color(0.98, 0.9, 0.72, 1), Color(0.74, 0.88, 0.9, 1), Color(0.98, 0.78, 0.7, 1), Color(0.84, 0.92, 0.76, 1), Color(0.96, 0.94, 0.9, 1)]
; (Seven clouds in the horizon bank, at exposure 1.05, the judge's round 39: sixteen at 1.3 piled into a heavy band brighter than the
; play area.)
cloud_bank=7
; (The sun's broken glint path on the sea, the judge's round 41.)
glint_path=0.7
; (The sea's look, water.gdshader `look`, fidelity review 5's water pass: the owner picked the paper waves, 2026-10-22.)
sea_look=3
; (The paper waves uneven and broken, fidelity review 6, the owner's pick B: water.gdshader `wave_vary`; every tier one scallop at one
; spacing read as a pattern.)
sea_vary=2
; (The paper waves as soft bands, fidelity review 8, the owner's pick A: water.gdshader `wave_band`; the white lips read as loops.)
sea_band=1
; (The horizon's cloud bank in two groups, behind the town and to the right, the sky over the fight open: fidelity review 9, the owner's
; pick B; seven cards along one line joined into a strip. StageArt._ocean.)
bank_look="B"
; (Shallows round the dock: sand bars seen through clear water, new art toward 5, the owner's pick A. water.gdshader `shallows`.)
sea_shallows=[1.0, 40.0, 0.0]
; (The quay under the town in buff stone, a step under the deck, the judge's round 40.)
quay=Color(0.7, 0.6, 0.48, 1)
quay_top=Color(0.8, 0.7, 0.55, 1)
cloud_exposure=1.05

[air]
; (The air retune, 2026-10-22: from 40 further back and a third of the lift, start 60.0, end 140.0, lift 0.16 before: the middle distance had greyed to saturation 0.18 to 0.29; far 40 further back too; the far ranges keep their far_lift.)

start=100.0
end=180.0
; (A fifth of 0.22, the light pass, 2026-10-21: the distance stays coloured, lifted toward the haze, not greyed.)
desat=0.044
lift=0.048
haze=Color(0.78, 0.88, 0.94, 1)
; Past `end` the lift keeps growing, to `far_lift` at `far` (the stage refinement's pass 1, 2026-10-20: the ranges and far land
; took no air and read darker than the mid-ground in front of them; each row now a step lighter toward the horizon).
far=190.0
far_lift=0.3
