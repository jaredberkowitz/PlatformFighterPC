; The ocean stage's palette (docs/art/STYLE_SHEET.md): its theme colours, read by StageArt.theme (scripts/stage_art.gd).
; Tune colours here, not in the code. Comments in brackets record why a value is what it is.

[theme]

; (A pale warm horizon above a deepening far sea, 2026-10-19: at the sea's own pale blue the two ran together.)
sky_top=Color(0.06, 0.38, 0.9, 1)
sky_mid=Color(0.24, 0.62, 0.98, 1)
sky_horizon=Color(0.6, 0.86, 1.0, 1)
sky_glow=[Color(1.0, 0.96, 0.86, 1), 0.15]
sky_wisps=[Color(1.0, 1.0, 1.0, 1), 0.45]
soil=Color(0.82, 0.66, 0.5, 1)
soil_dark=Color(0.6, 0.48, 0.46, 1)
grass=Color(0.96, 0.8, 0.5, 1)
grass_light=Color(1.0, 0.95, 0.78, 1)
wood=Color(0.8, 0.62, 0.42, 1)
wood_dark=Color(0.58, 0.42, 0.28, 1)
pattern="dock"
cap="dock"
platform="wood"
grass_vary=0.14
grass_patch=0.25
; The sky answering the sun (the judge's round 41): paler and warmer toward the high sun's side, a deeper blue away.
sun_dir=Vector3(-0.42, 0.25, -0.88)
sun_side=0.2
halo=0.5

[mist]

layers=[[-130.0, -10.0, 6.0, 0.08]]

[backdrop]

; (Warm reds and oranges with one teal: the blue roofs went grey in the air.)
town_roofs=[Color(0.86, 0.36, 0.3, 1), Color(0.26, 0.6, 0.62, 1), Color(0.9, 0.58, 0.3, 1), Color(0.92, 0.46, 0.34, 1), Color(0.8, 0.42, 0.52, 1)]
town_walls=[Color(0.98, 0.9, 0.72, 1), Color(0.74, 0.88, 0.9, 1), Color(0.98, 0.78, 0.7, 1), Color(0.84, 0.92, 0.76, 1), Color(0.96, 0.94, 0.9, 1)]
; (Seven clouds in the horizon bank, at exposure 1.05, the judge's round 39: sixteen at 1.3 piled into a heavy band brighter than the
; play area.)
cloud_bank=7
; (The sun's broken glint path on the sea, the judge's round 41.)
glint_path=0.7
; (The quay under the town in buff stone, a step under the deck, the judge's round 40.)
quay=Color(0.7, 0.6, 0.48, 1)
quay_top=Color(0.8, 0.7, 0.55, 1)
cloud_exposure=1.05

[air]

start=60.0
end=140.0
desat=0.22
lift=0.16
haze=Color(0.78, 0.88, 0.94, 1)
; Past `end` the lift keeps growing, to `far_lift` at `far` (the stage refinement's pass 1, 2026-10-20: the ranges and far land
; took no air and read darker than the mid-ground in front of them; each row now a step lighter toward the horizon).
far=150.0
far_lift=0.3
