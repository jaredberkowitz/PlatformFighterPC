; The grove stage's palette (docs/art/STYLE_SHEET.md): its theme colours, read by StageArt.theme (scripts/stage_art.gd).
; Tune colours here, not in the code. Comments in brackets record why a value is what it is.

[theme]

sky_top=Color(0.28, 0.5, 0.98, 1)
sky_mid=Color(0.52, 0.66, 1.0, 1)
sky_horizon=Color(0.98, 0.76, 0.86, 1)
sky_glow=[Color(1.0, 0.72, 0.82, 1), 0.55]
sky_wisps=[Color(1.0, 0.9, 0.96, 1), 0.45]
soil=Color(0.86, 0.66, 0.38, 1)
soil_dark=Color(0.72, 0.5, 0.27, 1)
; (Lighter and yellower, the owner, stage refinement 2026-10-20, after the grove reference's yellow-green lawn: at 0.42, 0.8, 0.36 the
; lawn under the fighters measured 0.56, their own value (0.55); now 0.64 to 0.70, hue 74, the lip's shade a deep yellow-green.)
grass=Color(0.58, 0.9, 0.3, 1)
grass_light=Color(0.8, 0.98, 0.44, 1)
wood=Color(0.93, 0.74, 0.5, 1)
wood_dark=Color(0.7, 0.48, 0.28, 1)
pattern="roots"
cap="grass"
platform="wood"
grass_vary=0.16
grass_patch=0.3
; (No "taper": tried in round 16, the upper tier narrowed past the one under it and bared its top as a pale ledge behind the roots.)
; (The style sheet's section 9, carried from the meadow, 2026-10-19: a clean top with a pale pink-cream path, and a faceted ledge in
; a deep version of its terracotta earth in place of the clod bank; its roots stay.)
; (A step darker, still cream, the judge's round 40: in greyscale the fighters stood on their own value and read only by outline.)
path_colour=Color(0.88, 0.79, 0.72, 1)
; (A padded quilt of diamonds under the grass, the owner, 2026-10-19: the grove is a fantasy island, and a cartoonish front suits it
; better than rock; each stage's front may differ. Modelled, not painted.)
quilt=Color(0.88, 0.66, 0.42, 1)
; The sky answering the sun (the judge's round 41): a pink glow low on the key's side, lilac away.
sun_dir=Vector3(-0.42, 0.08, -0.9)
sun_side=0.65
halo=0.35

[mist]

layers=[[-90.0, -26.0, 16.0, 0.04]]

[backdrop]

; The paper finish on the scenery (Lighting.paper_finish): "B" (the owner's pick in the paper play-area rollout, 2026-10-20).
paper_finish="B"
; The hatched print on the front, play area and paper props (StageBake.surfaces, tools/art/make_prints.py "B"; the owner's pick in
; the meadow pilot, rolled out 2026-10-21).
paper_print="hatched"
; The front at the full paper finish, "C" (the owner's pick for every front, 2026-10-21).
front_finish="C"

; The clouds folded like the pines, fewer and larger puffs (StageArt._clouds `cloud_style` 3; the owner's pick D of four mocks,
; 2026-10-20, docs/art/stages/FOLDED_STYLE.md).
; Cut from card since 2026-10-21 (style 4, the owner's pick after the backgrounds audit, docs/art/stages/BACKGROUNDS.md): flat
; cumulus with a deeper card behind, as the papercraft references draw them; the folded puffs read as crystal.
cloud_style=4

; The hill rows and rises folded into clean ridges running down from each crest (StageArt._land_band; the owner's pick D of four
; mocks, 2026-10-20, docs/art/stages/FOLDED_STYLE.md): a share of the band's column width, steep enough to cross the cel bands.
hill_fold=0.6
hill_fold_clean=true

; (Deeper and cooler, the judge's round 39 and the owner's grove reference: a lush island over a darker violet distance.)
hills_near=Color(0.2, 0.46, 0.4, 1)
hills_far=Color(0.38, 0.4, 0.7, 1)
fore_band=Color(0.26, 0.54, 0.38, 1)
; (A step lighter, without ink, round 39: dark dead centre, it framed the fighters in a dark block.)
great_bark=Color(0.66, 0.49, 0.38, 1)

[air]

start=40.0
end=120.0
; (A fifth of 0.15, the light pass, 2026-10-21: the distance stays coloured, lifted toward the haze, not greyed.)
desat=0.03
lift=0.15
haze=Color(0.78, 0.74, 0.92, 1)
; Past `end` the lift keeps growing, to `far_lift` at `far` (the stage refinement's pass 1, 2026-10-20: the ranges and far land
; took no air and read darker than the mid-ground in front of them; each row now a step lighter toward the horizon).
far=165.0
far_lift=0.45
