; The city stage's palette (docs/art/STYLE_SHEET.md): its theme colours, read by StageArt.theme (scripts/stage_art.gd).
; Tune colours here, not in the code. Comments in brackets record why a value is what it is.

[theme]

; (A night sky, fidelity review 6, the owner's pick C, 2026-10-22: the cameras see the sky only from the horizon to about 0.09 up, and the
; glow filled all of it, one flat magenta, value 0.37. Now graded across that little: a cool navy at the top of the frame (0.07), the
; glow rising from behind the skyline and held low (`sky_bands`, `glow_height` [centre, reach, full below]). Before it: the calmer
; magenta, the owner's pick B of four mocks, stage refinement pass 3, 2026-10-20; `--pal-try=pre_night` shows it.)
sky_top=Color(0.08, 0.11, 0.3, 1)
sky_mid=Color(0.1, 0.12, 0.34, 1)
sky_horizon=Color(0.4, 0.28, 0.5, 1)
sky_glow=[Color(0.9, 0.52, 0.5, 1), 0.42]
sky_bands=[0.01, 0.05]
glow_height=[0.005, 0.04, 1]
; (A warm stone facade, the gauntlet's round 5 after the owner's city reference: the play building is the warm, detailed layer in
; front of the cool skyline; the cool grey-violet facade was the coldest thing on it.)
; (A warm red brick, fidelity review 14 item 4, the owner's pick B: it was 0.6, 0.46, 0.42 and 0.44, 0.32, 0.32, pinkish brown that
; read mauve under the purple night.)
soil=Color(0.66, 0.36, 0.26, 1)
soil_dark=Color(0.48, 0.24, 0.2, 1)
grass=Color(0.56, 0.58, 0.66, 1)
grass_light=Color(0.78, 0.8, 0.88, 1)
wood=Color(0.84, 0.48, 0.41, 1)
wood_dark=Color(0.5, 0.26, 0.27, 1)
pattern="facade"
cap="roof"
platform="girder"
; The city's glow (the judge's round 41): a sodium pink-orange low behind the skyline, straight ahead, darker to the sides.
sun_dir=Vector3(0.0, 0.02, -1.0)
; (None, review 6: the sky mixes in linear colour, where even a tenth of the bright glow turned the dark night sky magenta.)
sun_side=0.0
halo=0.0

[mist]

layers=[[-80.0, -30.0, 24.0, 0.35]]

[backdrop]
; (The moon whole in the wide frame, fidelity review 13: at 34 the frame's top cut it.)
moon_y=19.0

; (The string lights hung with modelled lamps, fidelity review 6, the owner's pick B: StageArt._string_lights; bare spheres before.)
string_lights="model"

; The paper finish on the scenery (Lighting.paper_finish): "A" (the owner's pick in the paper play-area rollout, 2026-10-20).
paper_finish="A"
; The hatched print on the front, play area and paper props (StageBake.surfaces, tools/art/make_prints.py "B"; the owner's pick in
; the meadow pilot, rolled out 2026-10-21).
paper_print="hatched"
; The front at the full paper finish, "C" (the owner's pick for every front, 2026-10-21).
front_finish="C"

; The skyline as paper cards (StageArt._paper_skyline): "A" die-cut edge, "B" shadowed, "C" both, "" solid towers. (C, the owner's
; pick, 2026-10-20: the towers as standing cards with a pale cut edge and a soft shadow, as the other stages' paper backgrounds.)
paper_sky="C"

; The skyline's three layers, near to far.
; (Lighter and a little redder, stage refinement pass 3, 2026-10-20: the near layer measured 0.22, the darkest large area behind the
; fighters, and blue-violet against the reference's one violet family; now 0.30, the far layer 0.36.)
; (Cooler, a blue-violet, review 6's colour plan, the owner's pick C: the warm light kept for the street haze, the windows, the glow and
; the play building, so the layers separate by temperature as well as value; all in one purple family, they ran together.)
skyline_shades=[Color(0.26, 0.25, 0.46, 1), Color(0.37, 0.38, 0.62, 1), Color(0.52, 0.56, 0.8, 1)]
; (Haze between the rows, review 6: each row's foot fades into the street's lit haze, the further rows more, so every row reads further
; back than the one in front. [strength, height] a layer, near to far; facade.gdshader foot haze.)
skyline_haze=[[0.45, 20.0], [0.6, 26.0], [0.75, 32.0]]
skyline_haze_color=Color(0.8, 0.5, 0.5, 1)
; (Shaped light, fidelity review 7, the owner's pick A, 2026-10-23: the street's glow catching the towers' corners and parapets, a layer
; near to far (facade.gdshader `glow_edge`), and the roof's lamp pools brighter and a quarter wider [alpha, size]. `--shaped=T` before.)
skyline_glow_edge=[0.45, 0.35, 0.2]
lamp_pools=[0.68, 1.25]
; (The street a worn road a step lighter and greyer than the purple round it, with the street lamps' light pooled on it: fidelity review 9,
; the owner's pick B. StageArt._street.)
street_look="B"
; (Storefronts with depth: recessed windows and doors, goods in the windows, awnings at their own heights: new art toward 5, the owner's
; pick A. StageArt._street_furniture.)
storefront="A"
; (Signs at six tenths of their old strength, the judge's round 39: still the brightest things on screen.)
; (Three tenths, stage refinement pass 3: at six the OPEN and SHOP signs measured 0.55, brighter than both fighters; now 0.45 to 0.47.)
sign_dim=0.3
; (A quiet band behind the fight, fidelity review 5, the owner's pick A, 2026-10-22: the towers right behind the fighters were the
; busiest background in the game. facade.gdshader `calm` on the two nearer layers.)
skyline_calm=1.0
; (The skyline in three value steps, fidelity review 13 item 7, the owner's pick B, 2026-10-27: the layers sat close in one purple.
; The near one a deep indigo, the far one lighter and bluer; they replace `skyline_shades`. And more of the two nearer layers' windows
; lit, warm light through the purple.)
skyline_steps=[Color(0.19, 0.17, 0.38, 1), Color(0.36, 0.37, 0.64, 1), Color(0.6, 0.68, 0.9, 1)]
skyline_warm=1.8
; (The lit roof a third of the way to a warm peach, fidelity review 14 item 4, the owner's pick B: StageBake.place_play.)
roof_warm=0.35
; (The brick's tones stretched and the roof painted, fidelity review 16 item 6, the owner's pick A, 2026-10-30: the wall read as one colour
; repeated. StageBake.CITY_PAINT.)
city_paint="A"
; (The scaffold towers in a deep painted slate, inked dark: in pale galvanised steel they were bright lattices against the night.)
scaffold_steel=Color(0.34, 0.3, 0.44, 1)

[air]

start=40.0
end=140.0
; (A fifth of 0.2, the light pass, 2026-10-21: the distance stays coloured, lifted toward the haze, not greyed.)
desat=0.04
lift=0.2
; (Cooler, review 6's colour plan.)
haze=Color(0.36, 0.34, 0.6, 1)

; The city before review 6's night sky (`--pal-try=pre_night` on the stage demo, to compare).
[try_pre_night]
theme/sky_top=Color(0.08, 0.06, 0.22, 1)
theme/sky_mid=Color(0.22, 0.12, 0.36, 1)
theme/sky_horizon=Color(0.42, 0.24, 0.48, 1)
theme/sky_glow=[Color(0.8, 0.42, 0.62, 1), 0.32]
theme/sky_bands=[0.035, 0.13]
theme/glow_height=[0.03, 0.3, 0]
theme/sun_side=0.25
backdrop/skyline_shades=[Color(0.34, 0.24, 0.44, 1), Color(0.48, 0.36, 0.6, 1), Color(0.66, 0.54, 0.8, 1)]
backdrop/skyline_haze=[[0.0, 1.0], [0.0, 1.0], [0.0, 1.0]]
air/haze=Color(0.42, 0.3, 0.56, 1)
