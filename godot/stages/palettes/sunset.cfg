; The sunset stage's palette (docs/art/STYLE_SHEET.md): its theme colours, read by StageArt.theme (scripts/stage_art.gd).
; Tune colours here, not in the code. Comments in brackets record why a value is what it is.

[theme]

; (Cooler above, the owner's pick D of four mocks, stage refinement pass 6, 2026-10-20: a lilac upper sky and lilac air over the warm
; sun, glow, sand and rock, the warm-cool split of the owner's desert reference; every layer was one warm hue. docs/art/stages/mocks/canyon_dusk/.)
sky_top=Color(0.42, 0.42, 0.78, 1)
sky_mid=Color(0.6, 0.58, 0.86, 1)
sky_horizon=Color(1.0, 0.64, 0.4, 1)
; (The gradient fitted to what the cameras see, about 0.03 to 0.09 up, fidelity review 13 item 4, the owner's pick B, 2026-10-27:
; at the shader's own bands the top was reached at 0.13 and every frame showed the pale lower half. The top 22% deeper and the
; middle 8%, in the sky only, StageArt.sky.)
sky_bands=[0.012, 0.07]
sky_deepen=[0.22, 0.08]
; (The sky pass, fidelity review 5: horizon light and soft painted streaks, sky.gdshader look 2, the owner's pick B, 2026-10-22.)
sky_look=2
; (Half the glow, 2026-10-19: at 0.7 it washed the whole frame in one orange haze; 0.22, the judge's round 40, clear air.)
sky_glow=[Color(1.0, 0.56, 0.26, 1), 0.22]
sky_wisps=[Color(1.0, 0.7, 0.62, 1), 0.5]
soil=Color(0.86, 0.5, 0.32, 1)
soil_dark=Color(0.68, 0.34, 0.24, 1)
; (The front a fifth of the way toward a pale sand, fidelity review 5: dark and saturated, 0.30 at saturation 0.61, it weighed down the
; lower half of the frame. StageBake._front_lift; the owner's pick B, 2026-10-22.)
; (0.35 since review 6's sediment courses: their extra cut edges and crevices darkened the face back to 0.30; at 0.35 it measures 0.33.)
; (0.28 since review 9's uneven beds: fewer, larger flat faces lift it; with the strong key it measures 0.39, today's 0.37 at 0.35.)
front_lift=0.28
grass=Color(0.93, 0.74, 0.46, 1)
; (Sun-bleached, in the other stages' range of wood: art review 6 round 8, the canyon's dark maroon planks read as black bars
; against its bright sky, the one stage whose platforms broke the family.)
grass_light=Color(0.98, 0.86, 0.6, 1)
wood=Color(0.82, 0.57, 0.42, 1)
wood_dark=Color(0.58, 0.37, 0.29, 1)
pattern="strata"
cap="sand"
platform="wood"
grass_vary=0.18
grass_patch=0.3
; (A clean sand top, the style sheet's section 9; the drawn strata front kept, the owner preferring it to a faceted ledge, 2026-10-19.)
clean_top=true
; The sun: where it is drawn, and how the sky and the air answer it (the judge's round 41, the owner: the sun and sky read flat).
; `sun_side` warms the low sky on its side and cools the far side, `halo` its aureole, `rays` the light shafts (shaders/post.gdshader).
; (Far behind every range, the owner, 2026-10-19: at z -140 it sat between the near and far mesa ranges. Scaled with its distance
; so it looks the size it did.)
sun_at=Vector3(-89, -11.5, -300)
sun_size=19.4
sun_side=0.3
halo=1.0
rays=0.8

[mist]

layers=[[-95.0, -24.0, 16.0, 0.02]]

[backdrop]
; (A composed sky, fidelity review 13, the owner's pick B: a bank to the right, clear of the sun, and a calmer far layer.)
sky_groups=[[38.0, 18.0, -110.0, 2.2, 1], [58.0, 22.0, -118.0, 1.6, 2], [24.0, 24.0, -124.0, 1.2, 0], [-30.0, 25.0, -126.0, 1.1, 2]]
; (A second, farther layer of clouds behind the far land, toward the horizon's colour: the owner's pick B, 2026-10-25, after fidelity
; review 9; the canyon's sky had two clouds. StageArt._far_clouds [count, size, how pale].)
; (A third as many, half again as large, fidelity review 13's composed sky B.)
cloud_far=[3, 1.425, 0.3]

; The paper finish on the scenery (Lighting.paper_finish): "B" (the owner's pick in the paper play-area rollout, 2026-10-20).
paper_finish="B"
; The hatched print on the front, play area and paper props (StageBake.surfaces, tools/art/make_prints.py "B"; the owner's pick in
; the meadow pilot, rolled out 2026-10-21).
paper_print="hatched"
; The front at the full paper finish, "C" (the owner's pick for every front, 2026-10-21).
front_finish="C"

; The clouds folded like the pines, fewer and larger puffs (StageArt._clouds `cloud_style` 3; the owner's pick D of four mocks,
; 2026-10-20, docs/art/stages/FOLDED_STYLE.md).
; Cut from card since 2026-10-21 (style 4, the owner's pick after the backgrounds audit, docs/art/stages/BACKGROUNDS.md): flat
; cumulus with a deeper card behind, as the papercraft references draw them; the folded puffs read as crystal.
cloud_style=4

; (The buttes in the stage's strata, faded with distance toward a rosy violet, the near row and the far: half the round 38 fade, the
; judge's round 39 and the owner's canyon reference, far rock read by value and size in clear air.)
butte_haze=Color(0.62, 0.56, 0.8, 1)
butte_fades=[0.14, 0.3]
; (Golden sand, the owner's canyon reference: the lightest warm area of the frame, not a pale pink.)
desert_floor=Color(0.94, 0.68, 0.4, 1)

[air]

start=40.0
end=140.0
; (A fifth of 0.15, the light pass, 2026-10-21: the distance stays coloured, lifted toward the haze, not greyed.)
desat=0.03
lift=0.15
haze=Color(0.78, 0.7, 0.88, 1)
; (The far dunes lift toward the lilac air and take its hue, `range_tint`, stage refinement pass 6.)
far=175.0
far_lift=0.5
range_tint=1.0
