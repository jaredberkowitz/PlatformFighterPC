; The meadow stage's palette (docs/art/STYLE_SHEET.md): its theme colours, read by StageArt.theme (scripts/stage_art.gd).
; Tune colours here, not in the code. Comments in brackets record why a value is what it is.

[theme]
; (Fidelity review 7, the owner's pick B, 2026-10-22: the gradient fitted to the little sky the cameras see, a deeper blue at the top
; of the frame, a warm glow behind the mountains; the clouds lowered into the frame below. `--pal-try=pre_sky7` shows the sky before.)

; (Cyan, sampled from the owner's blue-mountain reference, 2026-10-19: ours read grey-blue beside it.)
sky_top=Color(0.02, 0.42, 0.78, 1)
sky_mid=Color(0.12, 0.7, 0.9, 1)
sky_horizon=Color(0.86, 0.94, 0.9, 1)
; (The sky pass, fidelity review 5: horizon light and soft painted streaks, sky.gdshader look 2, the owner's pick B, 2026-10-22.)
sky_look=2
sky_glow=[Color(1.0, 0.9, 0.7, 1), 0.45]
sky_wisps=[Color(1.0, 1.0, 1.0, 1), 0.5]
soil=Color(0.76, 0.56, 0.36, 1)
soil_dark=Color(0.52, 0.37, 0.25, 1)
grass=Color(0.46, 0.8, 0.24, 1)
grass_light=Color(0.72, 0.95, 0.4, 1)
wood=Color(0.86, 0.62, 0.36, 1)
wood_dark=Color(0.62, 0.42, 0.24, 1)
pattern="earth"
cap="grass"
platform="wood"
grass_vary=0.18
grass_patch=0.35
moss=Color(0.4, 0.66, 0.14, 1)
; (Bright lime, clean, the owner, 2026-10-19, after the papercraft adventure's blue-mountain camp: the foreground had gone dark and
; muddy; vivid ground against cool blue mountains, high-key light. Fighters read by their outlines and colour, lighter or darker.)
; (A step less saturated, deepening toward the back, gauntlet round 3: the brightest, flattest colour on screen.)
; (And another, the same value, the gauntlet's round 13: the references keep large surfaces muted, saturation for small accents.)
; (Its colour back, a hair deeper, the meadow pilot of docs/art/STYLE_SHEET.md, 2026-10-19: the ground stays colourful, calmed by
; lowering its contrast and noise; muted it read dull; and at least 0.05 under the orange fighter in greyscale.)
grass_back=0.4
; (The clean top with a calm pale path where the fighters stand, docs/art/STYLE_SHEET.md section 9.)
; (A step darker, still cream, the judge's round 40: in greyscale the fighters stood on their own value and read only by outline.)
path_colour=Color(0.87, 0.84, 0.66, 1)
; The stage as a hillside farm terrace (2026-10-18, the owner: a place, not a box): a dry-stone retaining wall holding the field up,
; a grassy hill below it running down into the valley (`_meadow_hill`), a lower terrace in front, the farm nearby.
terrace=true
; (The wall battered, leaning back into the field as a dry-stone retaining wall does, narrowing this much each side per unit down: the
; gauntlet's round 16, a straight-sided block read as a level-editor box. Visual only; the collision is the block's.)
taper=0.13

; (The reference's ledge face, the meadow rebuild's step 3, and a deep green-grey, the judge's round 39.)
; (A light moss, the owner's pick of four mocks, stage refinement pass 2, 2026-10-20: at 0.2, 0.3, 0.25 the cliff measured 0.17, a
; near-black slab across a quarter of the frame; a grey sage went the pale blue-grey round 39 rejected. docs/art/stages/mocks/.)
ledge=Color(0.4, 0.62, 0.32, 1)
; The sky answering the sun (the judge's round 41): the low sky warmer on the key light's side (left, behind), cooler away.
sun_dir=Vector3(-0.42, 0.1, -0.9)
sun_side=0.22
halo=0.4
sky_bands=[0.012, 0.07]
glow_height=[0.005, 0.05, 1]

[mist]

; Fog layers: [z, bottom y, height, strength]. (Thinner, art review 9; clear air, the meadow rebuild's step 3.)
; (None, the judge's round 40: the last two bands were the pale strip at the ranges' foot, the reference's air is clear.)
layers=[]

[backdrop]
; (A composed sky, fidelity review 13, the owner's pick B: a few large clouds in two groups apart, the sky over the fight open; it was
; eleven small ones at random. StageArt._composed_sky, [x, y, z, size, kind].)
sky_groups=[[-58.0, 12.0, -112.0, 2.1, 1], [-40.0, 16.0, -120.0, 1.4, 2], [-72.0, 17.0, -125.0, 1.1, 0], [48.0, 11.0, -106.0, 1.9, 2], [66.0, 15.0, -116.0, 1.4, 1], [14.0, 18.0, -128.0, 0.9, 0]]
; (The great peaks painted, broad value and warm-cool patches across their faces: fidelity review 12, the owner's pick A. StageArt.ridge.)
range_drift=[3.0, 1.2, 24.0, 0.8]
; (The lanes in the farmyard's earth, fidelity review 11, the owner's pick C: in cream they were the lower third's brightest thing.)
lane_look="C"
; (The farm things at the wall's foot tidied, fidelity review 9, the owner's pick: two bales side by side at each end. StageArt HillProps.)
foot_tidy=true
; (Painted variation on the play area, broad soft value patches and a warm-cool wander: fidelity review 10, the owner's pick C (the front
; left as it is). StageBake._paint_drift [value, wander, size, tops warm, play area only].)
paint_drift=[1.3, 0.8, 14.0, 0.5, 1]

; (The ranges painted by height, fidelity review 8, the owner's pick A, 2026-10-25: ragged snowcaps on the faces turned up and a tree line
; at the foot, StageArt.ridge `alt`; they read as a few flat teal planes. `--range-form=0` shows them as before.)
range_form=1
cloud_band=[7.0, 17.0]
cloud_scale=0.85

; The clouds folded like the pines, fewer and larger puffs (StageArt._clouds `cloud_style` 3; the owner's pick D of four mocks,
; 2026-10-20, docs/art/stages/FOLDED_STYLE.md).
; Cut from card since 2026-10-21 (style 4, the owner's pick after the backgrounds audit, docs/art/stages/BACKGROUNDS.md): flat
; cumulus with a deeper card behind, as the papercraft references draw them; the folded puffs read as crystal.
cloud_style=4
; (Clouds clear of the frame, fidelity review 14 item 1, the owner's pick B, 2026-10-27: each cloud crossing the match camera's top
; lowered until whole, far ones under the wide camera's top, the moved ones at 0.8 of their size. StageArt._clear_of_frame.)
cloud_clear="B"

; The hill rows and rises folded into clean ridges running down from each crest (StageArt._land_band; the owner's pick D of four
; mocks, 2026-10-20, docs/art/stages/FOLDED_STYLE.md): a share of the band's column width, steep enough to cross the cel bands.
; The paper finish on the scenery (Lighting.paper_finish): "B" a fibre grain, a sheet-to-sheet wobble and a pale cut edge (the owner's
; pick in the paper pilot, 2026-10-20).
paper_finish="B"
; The printed surface on the front, play area and paper props (StageBake.surfaces, tools/art/make_prints.py "B"), and the front at
; about the full paper finish: the owner's picks in the meadow pilot, 2026-10-21 (docs/art/stages/FIDELITY_REVIEW_3.md).
paper_print="hatched"
front_finish="C"
hill_fold=0.6
hill_fold_clean=true

hills_near=Color(0.36, 0.72, 0.34, 1)
hills_far=Color(0.42, 0.66, 0.6, 1)
fore_band=Color(0.46, 0.76, 0.32, 1)
; (The papercraft camp's patchwork of lime crops and warm earth; sage and one warm sand, round 35.)
; How much of the hills' and fields' own saturation they keep (StageBake._calm; 0.72 elsewhere): all of it since the air retune, 2026-10-22,
; as the reference's lime grass.
calm=1.0
fields=[Color(0.5, 0.78, 0.32, 1), Color(0.62, 0.76, 0.5, 1), Color(0.6, 0.82, 0.36, 1), Color(0.86, 0.82, 0.64, 1), Color(0.56, 0.72, 0.46, 1)]
hedgerow=Color(0.36, 0.58, 0.32, 1)
; (A red and a honey roof: the blue one went grey in the valley's air.)
cottage_roofs=[Color(0.82, 0.36, 0.28, 1), Color(0.84, 0.58, 0.3, 1)]
; (Four greens, as the reference's pine belt mixes them: a slate, a forest green, a teal and a fresh green.)
pine_greens=[Color(0.2, 0.36, 0.28, 1), Color(0.22, 0.3, 0.3, 1), Color(0.16, 0.38, 0.34, 1), Color(0.26, 0.44, 0.26, 1)]

[air]
; (The air retune, 2026-10-22: from 40 further back and a third of the lift, start 40.0, end 100.0, lift 0.18 before: the middle distance had greyed to saturation 0.18 to 0.29; far 40 further back too; the far ranges keep their far_lift.)

; The scenery's fade with distance behind the stage (StageArt._air): none before `start`, at most `desat` and `lift` toward `haze` by
; `end`. (Light, the reference's clear air: the mid-ground keeps its colour and sits back by being a little cooler and lighter.)
start=80.0
end=140.0
; (A fifth of 0.2, the light pass, 2026-10-21: the distance stays coloured, lifted toward the haze, not greyed.)
desat=0.04
lift=0.054
haze=Color(0.72, 0.88, 0.9, 1)
; Past `end` the lift keeps growing, to `far_lift` at `far` (the stage refinement's pass 1, 2026-10-20: the ranges and far land
; took no air and read darker than the mid-ground in front of them; each row now a step lighter toward the horizon).
far=210.0
far_lift=0.5

