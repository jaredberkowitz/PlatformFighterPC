name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run --release -p tools --bin pftool -- fuzz-rollback 300
      # Determinism gate: the same recorded inputs must give identical checksums on every platform.
      - name: Checksum replay
        shell: bash
        run: cargo run --release -p tools --bin pftool -- selftest > checksums-${{ matrix.name }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.name }}
          path: checksums-${{ matrix.name }}.txt

  compare-checksums:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          merge-multiple: true
      - name: All platforms must agree
        run: |
          ls -l
          first=$(ls checksums-*.txt | head -n1)
          cat "$first"
          for f in checksums-*.txt; do
            diff -u "$first" "$f" || { echo "DESYNC: $f differs from $first"; exit 1; }
          done
          echo "All $(ls checksums-*.txt | wc -l) platforms produced identical checksums."
